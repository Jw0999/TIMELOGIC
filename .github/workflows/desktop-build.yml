name: Build Desktop Installers

# Builds the TimeLogic Admin desktop app for Windows, macOS and Linux on real
# runners (where Wine / macOS / FUSE exist). Trigger it from the Actions tab
# ("Run workflow"), then download the installers from the run's Artifacts.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        env:
          # Live backend API (public URL, safe to bake in)
          VITE_API_URL: https://backend-production-eb91.up.railway.app/api
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: timelogic-admin-${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.zip
            desktop/release/*.deb
          if-no-files-found: ignore
